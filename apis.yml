name: TEDI
description: >-
  TEDI (Tecnologia y Educacion Innovadora) is a Latin American EdTech platform delivering
  professional training for the construction and engineering industries under the motto
  "Mejores profesionales, mejores paises." It runs 150+ live and recorded courses each month
  covering BIM, VDC, Lean management, and project management, plus Autodesk/PMI-aligned
  certifications, an exclusive construction job board, a professional community, the EDI AI
  learning assistant, and a TEDICOINS rewards system. TEDI reports 50,000+ certified students
  across 18+ countries with 150+ expert instructors, and is backed by 500 Global. The company
  operates a consumer-facing web platform (tedivirtual.com / tedicomunidad.com) and, as of this
  enrichment pass, publishes no public API, developer portal, or technical documentation.
